# Configuração AVANÇADA para Deep Learning
# Inclui TODAS as melhorias: Wavelet, Multi-Timeframe, Transformer, etc.

# === DADOS ===
data:
  symbols:
    - BTCUSDT
    - ETHUSDT

  timeframes:
    - 15m
    - 1h    # Multi-timeframe
    - 4h    # Multi-timeframe

  lookback_days: 730  # 2 anos

  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  exchange: "bybit"
  market_type: "linear"

# === FEATURE ENGINEERING ===
features:
  ema_periods: [9, 21, 50, 200]
  rsi_period: 14
  stoch_period: 14
  stoch_smooth: 3
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14
  volume_ma_period: 20

  # NOVAS FEATURES AVANÇADAS
  wavelet:
    enabled: true
    wavelet_type: 'db4'
    decomposition_level: 3

  market_regime:
    enabled: true
    n_regimes: 3
    lookback: 100

  multi_timeframe:
    enabled: true
    higher_timeframes: [1h, 4h]

# === LABELING (Triple Barrier Method) ===
labeling:
  method: "triple_barrier_dynamic"  # Usa barreiras dinâmicas baseadas em volatilidade
  forward_window: 8  # 8 candles = 2 horas em 15m

  # Profit target (dinâmico)
  profit_target_atr: 1.5
  profit_target_dynamic: true
  profit_multiplier_low_vol: 1.2
  profit_multiplier_high_vol: 2.0

  # Stop loss (dinâmico)
  stop_loss_atr: 1.0
  stop_loss_dynamic: true
  stop_multiplier_low_vol: 0.8
  stop_multiplier_high_vol: 1.5

  time_limit: 12  # 3 horas em 15m

# === MODELO ===
model:
  architecture: "transformer"
  sequence_length: 40  # Aumentado de 20 para 40

  transformer:
    d_model: 128
    num_heads: 8
    num_layers: 3
    ff_dim: 256
    dropout: 0.3

  deep_learning:
    conv_filters: [32, 32, 32]
    conv_kernels: [3, 5, 7]
    lstm_units: 128
    attention_units: 64
    dropout_rate: 0.3

  output_dir: "models"

# === TRAINING ===
training:
  optimizer: "adam"
  learning_rate: 0.001
  loss: "focal_loss"
  focal_loss_gamma: 2.0
  epochs: 100
  batch_size: 64

  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_auc"

  reduce_lr:
    enabled: true
    factor: 0.5
    patience: 7
    min_lr: 0.00001

# === ENSEMBLE ===
ensemble:
  enabled: true
  models: [deep_learning, lightgbm, xgboost]
  method: "stacking"
  meta_learner: "logistic_regression"

# === DATASET ===
dataset:
  train_pct: 0.70
  val_pct: 0.15
  test_pct: 0.15
  exclude_features:
    - timestamp
    - open
    - high
    - low
    - close
    - volume
    - target_price
    - target_class
    - target_barrier
    - target_return
    - barrier_hit  # String categórica (UPPER/LOWER/TIME)

# === BACKTESTING ===
backtesting:
  initial_capital: 10000
  fee_rate: 0.0006
  slippage: 0.0001
  cooldown_minutes: 15
  position_size: 0.3

# === LOGGING ===
logging:
  level: INFO
